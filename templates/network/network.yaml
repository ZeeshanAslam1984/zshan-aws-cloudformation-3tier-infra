AWSTemplateFormatVersion: '2010-09-09'
Description: Orchestrates all networking components for MyApp

Parameters:
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24
  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.3.0/24
  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.4.0/24

Resources:

  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./vpc.yaml
      Parameters:
        VpcCIDR: !Ref VpcCIDR

  SubnetStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./subnets.yaml
      Parameters:
        VpcId: !GetAtt VPCStack.Outputs.VPCId
        PublicSubnet1CIDR: !Ref PublicSubnet1CIDR
        PublicSubnet2CIDR: !Ref PublicSubnet2CIDR
        PrivateSubnet1CIDR: !Ref PrivateSubnet1CIDR
        PrivateSubnet2CIDR: !Ref PrivateSubnet2CIDR

  IGWStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./igw.yaml
      Parameters:
        VpcId: !GetAtt VPCStack.Outputs.VPCId

  NATGatewayStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nat-gateway.yaml
      Parameters:
        PublicSubnetId: !GetAtt SubnetStack.Outputs.PublicSubnet1Id

  RouteTableStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./route-tables.yaml
      Parameters:
        VpcId: !GetAtt VPCStack.Outputs.VPCId
        InternetGatewayId: !GetAtt IGWStack.Outputs.InternetGatewayId
        NatGatewayId: !GetAtt NATGatewayStack.Outputs.NatGatewayId
        PublicSubnetIds:
          - !GetAtt SubnetStack.Outputs.PublicSubnet1Id
          - !GetAtt SubnetStack.Outputs.PublicSubnet2Id
        PrivateSubnetIds:
          - !GetAtt SubnetStack.Outputs.PrivateSubnet1Id
          - !GetAtt SubnetStack.Outputs.PrivateSubnet2Id

  SecurityGroupStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./security-groups.yaml
      Parameters:
        VpcId: !GetAtt VPCStack.Outputs.VPCId

  NACLStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nacl.yaml
      Parameters:
        VpcId: !GetAtt VPCStack.Outputs.VPCId
        PublicSubnetIds:
          - !GetAtt SubnetStack.Outputs.PublicSubnet1Id
          - !GetAtt SubnetStack.Outputs.PublicSubnet2Id
        PrivateSubnetIds:
          - !GetAtt SubnetStack.Outputs.PrivateSubnet1Id
          - !GetAtt SubnetStack.Outputs.PrivateSubnet2Id

Outputs:
  VPCId:
    Value: !GetAtt VPCStack.Outputs.VPCId
  PublicSubnet1Id:
    Value: !GetAtt SubnetStack.Outputs.PublicSubnet1Id
  PublicSubnet2Id:
    Value: !GetAtt SubnetStack.Outputs.PublicSubnet2Id
  PrivateSubnet1Id:
    Value: !GetAtt SubnetStack.Outputs.PrivateSubnet1Id
  PrivateSubnet2Id:
    Value: !GetAtt SubnetStack.Outputs.PrivateSubnet2Id
