AWSTemplateFormatVersion: '2010-09-09'
Description: Internet Gateway and VPC attachment

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id

Resources:
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: MyApp-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcId
      InternetGatewayId: !Ref InternetGateway

Outputs:
  InternetGatewayId:
    Value: !Ref InternetGateway
