AWSTemplateFormatVersion: '2010-09-09'
Description: S3 bucket with event notifications to SNS

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: myapp-event-bucket
      NotificationConfiguration:
        TopicConfigurations:
          - Event: s3:ObjectCreated:*
            Topic: !Ref SNSTopic

Outputs:
  S3BucketName:
    Value: !Ref S3Bucket
